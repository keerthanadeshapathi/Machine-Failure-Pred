<!DOCTYPE html>
<html>
<head>
<title>Machine Failure Prediction</title>
<style>
body{font-family:Arial;background:#f0f2f6;margin:0;padding:30px}
.container{max-width:550px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{text-align:center;color:#222}
label{display:block;margin-top:15px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:25px;background:#ff4b4b;color:white;border:0;border-radius:6px;font-size:16px;cursor:pointer}
button:hover{background:#e63939}
#result{text-align:center;margin-top:20px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>⚙️ Machine Failure Prediction</h1>
<p>Enter machine details to predict whether the machine will fail.</p>
<form id="predictionForm">
<label>Machine Type</label>
<select id="machine_type">
<option value="L">L</option>
<option value="M">M</option>
<option value="H">H</option>
</select>
<label>Air Temperature (K)</label>
<input type="number" id="air_temp" value="300" step="any" required>
<label>Process Temperature (K)</label>
<input type="number" id="process_temp" value="310" step="any" required>
<label>Rotational Speed (rpm)</label>
<input type="number" id="rotational_speed" value="1500" required>
<label>Torque (Nm)</label>
<input type="number" id="torque" value="40" step="any" required>
<label>Tool Wear (min)</label>
<input type="number" id="tool_wear" value="100" required>
<button type="submit">Predict Machine Failure</button>
</form>
<div id="result"></div>
</div>
<script>
document.getElementById("predictionForm").addEventListener("submit",async function(e){
e.preventDefault();
const result=document.getElementById("result");
result.innerText="Predicting...";
const inputData={
Type:document.getElementById("machine_type").value,
air_temperature:Number(document.getElementById("air_temp").value),
process_temperature:Number(document.getElementById("process_temp").value),
rotational_speed:Number(document.getElementById("rotational_speed").value),
torque:Number(document.getElementById("torque").value),
tool_wear:Number(document.getElementById("tool_wear").value)
};
try{
const response=await fetch("https://machine-failure-pred-3.onrender.com/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(inputData)
});
const data=await response.json();
if(!response.ok)throw new Error(data.detail||"Prediction failed");
result.innerText=data.result;
}catch(error){
result.innerText="Error: "+error.message;
}
});
</script>
</body>
</html>
